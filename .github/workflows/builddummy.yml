name: Build Shim Only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install clang & lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils-aarch64-linux-gnu

      - name: Compile libgui_shim_miuicamera.so
        run: |
          printf 'void _ZN7android18BnProducerListener16onBufferDetachedEi(int s){(void)s;}\n' > shim.c
          clang --target=aarch64-linux-android -nostdlib -shared -fPIC -fuse-ld=lld -Wl,-soname,libgui_shim_miuicamera.so -o libgui_shim_miuicamera.so shim.c

      - name: Cek Simbol
        run: |
          aarch64-linux-gnu-readelf -Ws --dyn-syms --wide libgui_shim_miuicamera.so | grep onBufferDetached

      - name: Upload Shim
        uses: actions/upload-artifact@v4
        with:
          name: libgui_shim_miuicamera
          path: libgui_shim_miuicamera.so
